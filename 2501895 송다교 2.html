<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - 문의하기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <main class="max-w-4xl mx-auto my-12 p-6 bg-white rounded-2xl shadow-md w-full">
        
        <section class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">문의하기 (Contact Us)</h1>
            <p class="text-gray-600">궁금한 점이 있으신가요? 아래 양식을 작성해 주시면 답변 드리겠습니다.</p>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section>
                <form id="contactForm" class="space-y-4" novalidate>
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">이름 <span class="text-red-500">*</span></label>
                        <input type="text" id="name" name="name" placeholder="이름을 입력하세요" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <p id="nameError" class="text-xs text-red-500 mt-1 hidden">이름은 2자 이상 입력해주세요.</p>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">이메일 <span class="text-red-500">*</span></label>
                        <input type="email" id="email" name="email" placeholder="test@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <p id="emailError" class="text-xs text-red-500 mt-1 hidden">올바른 이메일 형식을 입력해주세요.</p>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1">전화번호 <span class="text-gray-400">(선택)</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="전화번호를 입력하세요" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label for="type" class="block text-sm font-semibold text-gray-700 mb-1">문의 유형 <span class="text-red-500">*</span></label>
                        <select id="type" name="type" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">▼ 선택하세요</option>
                            <option value="general">일반 문의</option>
                            <option value="service">서비스 문의</option>
                            <option value="tech">기술 지원</option>
                            <option value="partnership">제휴 문의</option>
                            <option value="quote">견전 요청</option>
                            <option value="etc">기타</option>
                        </select>
                        <p id="typeError" class="text-xs text-red-500 mt-1 hidden">문의 유형을 선택해주세요.</p>
                    </div>

                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">문의 제목 <span class="text-red-500">*</span></label>
                        <input type="text" id="title" name="title" maxlength="100" placeholder="제목을 입력하세요 (최대 100자)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <p id="titleError" class="text-xs text-red-500 mt-1 hidden">제목을 입력해주세요.</p>
                    </div>

                    <div>
                        <label for="content" class="block text-sm font-semibold text-gray-700 mb-1">문의 내용 <span class="text-red-500">*</span></label>
                        <textarea id="content" name="content" rows="5" placeholder="상세 문의 내용을 입력하세요 (최소 10자 이상)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        <p id="contentError" class="text-xs text-red-500 mt-1 hidden">내용을 10자 이상 입력해주세요.</p>
                    </div>

                    <div class="flex flex-col">
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="agree" name="agree" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <span class="text-sm text-gray-700">[개인정보 수집 동의] 동의합니다. <span class="text-red-500">*</span></span>
                        </label>
                        <p id="agreeError" class="text-xs text-red-500 mt-1 hidden">개인정보 수집에 동의하셔야 제출이 가능합니다.</p>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 cursor-pointer">
                        문의 보내기
                    </button>
                </form>

                <div id="resultModal" class="mt-4 p-4 rounded-lg text-center font-medium hidden"></div>
            </section>

            <section class="flex flex-col justify-between space-y-6">
                <div class="bg-gray-100 p-6 rounded-xl space-y-3">
                    <h2 class="text-xl font-bold text-gray-900 border-b pb-2 mb-4">회사 정보</h2>
                    <p class="text-sm text-gray-700 flex items-start">
                        <span class="font-bold w-16 shrink-0">주소 :</span> 
                        <span>서울특별시 강남구 테헤란로 123</span>
                    </p>
                    <p class="text-sm text-gray-700">
                        <span class="font-bold w-16 inline-block">전화 :</span> 02-1234-5678
                    </p>
                    <p class="text-sm text-gray-700">
                        <span class="font-bold w-16 inline-block">이메일 :</span> info@example.com
                    </p>
                </div>

                <div class="flex-1 min-h-[320px] bg-gray-200 rounded-xl overflow-hidden border border-gray-300 shadow-inner">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3165.174092572564!2d127.0351717!3d37.4990998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca40a4bf92a5d%3A0x6bbf75da4a6a682!2z7ISc7bqt7Yq567OE7IucIOqwleuCqOq1rCD some_unique_id_or_hash_ignored!5e0!3m2!1sko!2skr!4v1710000000000!5m2!1sko!2skr" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </section>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-200 w-full bg-white">
        &copy; 2026 Company Inc. All rights reserved.
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const type = document.getElementById('type').value;
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const agree = document.getElementById('agree').checked;

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const typeError = document.getElementById('typeError');
            const titleError = document.getElementById('titleError');
            const contentError = document.getElementById('contentError');
            const agreeError = document.getElementById('agreeError');
            const resultModal = document.getElementById('resultModal');

            let isValid = true;
            const errors = [nameError, emailError, typeError, titleError, contentError, agreeError];
            errors.forEach(err => err.classList.add('hidden'));
            resultModal.classList.add('hidden');

            if (name.length < 2) { nameError.classList.remove('hidden'); isValid = false; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { emailError.classList.remove('hidden'); isValid = false; }
            if (type === "") { typeError.classList.remove('hidden'); isValid = false; }
            if (title === "") { titleError.classList.remove('hidden'); isValid = false; }
            if (content.length < 10) { contentError.classList.remove('hidden'); isValid = false; }
            if (!agree) { agreeError.classList.remove('hidden'); isValid = false; }

            if (isValid) {
                resultModal.className = "mt-4 p-4 rounded-lg text-center font-medium bg-green-50 text-green-700 border border-green-200 whitespace-pre-line block";
                resultModal.innerText = `문의가 정상적으로 접수되었습니다.\n\n담당자가 확인 후 영업일 기준 1~2일 내에 답변드리겠습니다.`;
                document.getElementById('contactForm').reset();
            } else {
                resultModal.className = "mt-4 p-4 rounded-lg text-center font-medium bg-red-50 text-red-700 border border-red-200 whitespace-pre-line block";
                resultModal.innerText = `문의 전송 중 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요. (입력 항목을 다시 확인해주세요)`;
            }
        });
    </script>
</body>
</html>
